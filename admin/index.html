<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Content Manager - IRL MAREL</title>
</head>
<body>
  <!-- Este é o local exato onde o CMS vai se instalar -->
  <div id="nc-root"></div>

  <!-- Script do Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <!-- Script do Decap CMS com o atributo 'defer' (executa só depois da página carregar) -->
  <script defer src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
</body>
</html>
